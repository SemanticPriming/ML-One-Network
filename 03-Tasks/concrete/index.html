<!doctype html>
<html>
  <head>
    <title>Concreteness Study</title>

    <!-- Load jsPsych -->
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-survey/dist/index.browser.js"></script>
    <link
      href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css"
      rel="stylesheet"
    />

    <!-- Load SurveyJS -->
    <script src="https://unpkg.com/survey-core@1.12.2/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-js-ui@1.12.2/survey-js-ui.min.js"></script>
    <link
      href="https://unpkg.com/survey-core@1.12.2/defaultV2.min.css"
      rel="stylesheet"
    />

    <style>
      /* Widen the jsPsych + SurveyJS container */
      .jspsych-survey-container {
        max-width: 80vw; /* 80% of viewport width */
        width: 80vw;
        margin: 0 auto; /* center horizontally */
      }
      /* Override SurveyJS internal max-width that was squishing content */
      .sd-body.sd-body--static {
        max-width: 100% !important; /* allow it to fill the wider container */
      }
      /* Black full-width divider under each SurveyJS page title */
      .sd-page__title {
        border-bottom: 2px solid #000; /* solid black line */
        padding-bottom: 0.75rem;
        margin-bottom: 1.25rem;
        width: 100%;
      }
      /* Remove extra spacing created by SurveyJS completed-page pseudo-elements */
      .sd-body.sd-completedpage::before,
      .sd-body.sd-completedpage::after {
        height: 0 !important;
        min-height: 0 !important;
        max-height: 0 !important;
        display: block;
      }
    </style>
  </head>

  <body>
    <div id="jspsych-target"></div>
  </body>

  <script>
    // 1) Initialize jsPsych
    const jsPsych = initJsPsych({
      on_finish: function () {
        jsPsych.data.displayData();
      },
    });

    // 2b) Screen shown if participant does NOT consent
    const no_consent = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<h2>Thank you</h2><p>You have chosen not to participate. You may close this window.</p>`,
      choices: ["Close"],
    };

    // Generate a participant UUID once per session
    const participant_uuid =
      window.crypto && window.crypto.randomUUID
        ? window.crypto.randomUUID()
        : Math.random().toString(36).substring(2, 10) + "-" + Date.now();

    // Combined multi-page SurveyJS survey (consent + demographics + instructions)
    const combinedSurveyJson = {
      completedHtml: "",
      showHeaderOnCompletePage: false,
      pageNextText: "Next",
      pagePrevText: "Back",
      completeText: "Next",
      pages: [
        // ----- PAGE 1: CONSENT -----
        {
          name: "consent",
          title: "Consent to Participate",
          elements: [
            {
              type: "html",
              name: "consent_text",
              html: `
                <p>Please read the following carefully before continuing:</p>
                <p>This study involves completing brief questions and/or tasks about language and cognition. Your participation is voluntary. You may stop at any time without penalty. Your responses will be recorded for research purposes but will be kept confidential and analyzed in anonymized form.</p>
                <p>By proceeding you indicate that you are at least 18 years old.</p>
              `,
            },
            {
              type: "radiogroup",
              name: "consent_choice",
              title: "Do you consent to participate?",
              isRequired: true,
              choices: ["I Consent", "I Do Not Consent"],
            },
          ],
        },

        // ----- PAGE 2: DEMOGRAPHICS (only visible if they consent) -----
        {
          name: "demographics",
          title: "Demographic Information",
          visibleIf: "{consent_choice} = 'I Consent'",
          elements: [
            {
              type: "radiogroup",
              name: "gender",
              title: "Please tell us your gender:",
              choices: ["Male", "Female", "Other", "Prefer not to say"],
            },
            {
              type: "text",
              name: "birth_year",
              title: "Which year were you born? Please enter a four-digit year",
              isRequired: true,
              inputType: "number",
              validators: [{ type: "numeric", minValue: 1900, maxValue: 2025 }],
            },
            {
              type: "radiogroup",
              name: "education",
              title: "Please tell us your highest education level:",
              choices: [
                "Less than high school diploma",
                "High school diploma",
                "Associate's degree or two-year degree",
                "Bachelor's degree or four-year degree",
                "Master's degree or equivalent",
                "Doctoral degree or equivalent",
              ],
            },
            {
              type: "text",
              name: "native_language",
              title: "What is your native (first) language?",
            },
            {
              type: "radiogroup",
              name: "handedness",
              title: "Are you primarily left- or right-handed?",
              isRequired: true,
              choices: ["Left-handed", "Right-handed"],
            },
          ],
        },

        // ----- PAGE 3: TASK INSTRUCTIONS (only visible if they consent) -----
        {
          name: "instructions",
          title: "How to do this task",
          visibleIf: "{consent_choice} = 'I Consent'",
          elements: [
            {
              type: "html",
              name: "concrete_instructions",
              html: `
                <p>Some words refer to things or actions in reality, which you can experience directly through one of the five senses. We call these words concrete words. Other words refer to meanings that cannot be experienced directly but which we know because the meanings can be defined by other words. These are abstract words. Still other words fall in-between the two extremes, because we can experience them to some extent and in addition we rely on language to understand them. </p>
                <p>We want you to indicate how concrete the meaning of each word is for you by using a 9-point rating scale going from abstract to concrete. A concrete word comes with a higher rating and refers to something that exists in reality; you can have immediate experience of it through your senses (smelling, tasting, touching, hearing, seeing) and the actions you do. The easiest way to explain a word is by pointing to it or by demonstrating it (e.g. To explain 'sweet' you could have someone eat sugar; To explain 'jump' you could simply jump up and down or show people a movie clip about someone jumping up and down; To explain 'couch', you could point to a couch or show a picture of a couch). </p>
                <p>An abstract word comes with a lower rating and refers to something you cannot experience directly through your senses or actions. Its meaning depends on language. The easiest way to explain it is by using other words (e.g. There is no simple way to demonstrate 'justice'; but we can explain the meaning of the word by using other words that capture parts of its meaning).</p>
                <p>Because we are collecting values for all the words in a dictionary (over 60 thousand in total), you will see that there are various types of words, even single letters. Always think of how concrete (experience based) the meaning of the word is to you. In all likelihood, you will encounter several words you do not know well enough to give a useful rating. This is informative to us too, as in our research we only want to use words known to people. We may also include one or two fake words which cannot be known by you. Please indicate when you don't know a word by using the letter X (or x).Because we are collecting values for all the words in a dictionary (over 60 thousand in total), you will see that there are various types of words, even single letters. Always think of how concrete (experience based) the meaning of the word is to you. In all likelihood, you will encounter several words you do not know well enough to give a useful rating. This is informative to us too, as in our research we only want to use words known to people. We may also include one or two fake words which cannot be known by you. Please indicate when you don't know a word by using the letter X (or x).</p>
                <p>For each word, rate how abstract (1) or concrete (9) based on your first impression of the object and entering 'X' when you do not know a word.</p>
              `,
            },
          ],
        },
      ],
    };

    const pretask_survey = {
      type: jsPsychSurvey,
      survey_json: combinedSurveyJson,
    };

    // -----------------------------
    // DEMO CONCRETE TASK (SHORT LIST)
    // Replace `sampleWords` with your 400 words later
    // -----------------------------
    const sampleWords = [
      "dog",
      "bicycle",
      "apple",
      "school",
      "mountain",
      "telephone",
      "democracy",
      "hospital",
      "garden",
      "computer",
      "river",
      "window",
    ];

    // 1) Shuffle words once per participant
    const shuffledWords = jsPsych.randomization.shuffle(sampleWords);

    // 2) Split into small blocks (6 words per page for the demo)
    const BLOCK_SIZE = 6;
    const wordBlocks = [];
    for (let i = 0; i < shuffledWords.length; i += BLOCK_SIZE) {
      wordBlocks.push(shuffledWords.slice(i, i + BLOCK_SIZE));
    }

    // 3) Helper: build one SurveyJS matrix page for a block of words
    function makeConcreteMatrixSurvey(words, blockIndex) {
      const surveyJson = {
        showCompletedPage: false,
        showHeaderOnCompletePage: false,
        completedHtml: "",
        completeText: "Next",
        pages: [
          {
            name: `concrete_block_${blockIndex}`,
            title: `Word ratings (Block ${blockIndex + 1} of ${wordBlocks.length})`,
            elements: [
              {
                type: "multipletext",
                name: `concrete_block_${blockIndex}`,
                title:
                  "For each word, rate how abstract (1) or concrete (9) based on your first impression of the object and entering 'X' when you do not know a word.",
                items: words.map(function (w) {
                  return {
                    name: w,
                    title: w,
                    inputType: "text",
                    isRequired: true,
                    validators: [
                      {
                        type: "regex",
                        text: "Enter a number between 1 and 9",
                        regex: "^(X|x|[1-9][0-9]?$|100)$",
                      },
                    ],
                  };
                }),
              },
            ],
          },
        ],
      };

      return {
        type: jsPsychSurvey,
        survey_json: surveyJson,
      };
    }

    // 4) Create one jsPsych trial per block
    const concrete_trials = wordBlocks.map((block, i) =>
      makeConcreteMatrixSurvey(block, i),
    );

    // Final thank-you screen shown AFTER all word-rating blocks (SurveyJS style)
    const final_thankyou = {
      type: jsPsychSurvey,
      survey_json: {
        showCompletedPage: false,
        showHeaderOnCompletePage: false,
        completedHtml: "",
        completeText: "Finish",
        pages: [
          {
            name: "thank_you",
            title: "Thank you for participating",
            elements: [
              {
                type: "html",
                name: "thank_you_text",
                html: `
                  <p>You have completed the word ratings.</p>
                  <p>Your participant number is:</p>
                  <p><strong>${participant_uuid}</strong></p>
                  <p>Please keep or copy this number if you are asked for it.</p>
                `,
              },
            ],
          },
        ],
      },
    };

    const timeline = [
      pretask_survey,
      {
        timeline: [no_consent],
        conditional_function: function () {
          const last = jsPsych.data.get().last(1).values()[0];
          return last.consent_choice === "I Do Not Consent";
        },
      },
      ...concrete_trials,
      final_thankyou,
    ];

    // 4) Run the study
    jsPsych.run(timeline);
  </script>
</html>
