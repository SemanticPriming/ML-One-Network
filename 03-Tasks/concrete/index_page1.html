<!doctype html>
<html>
  <head>
    <title>Concreteness Study</title>

    <!-- Load jsPsych -->
    <script src="unpkg_jspsych.js"></script>
    <script src="jspsych_plugin_survey_dist_index_browser.js"></script>
    <link href="jspsych_css_jspsych.css" rel="stylesheet" />

    <!-- Load SurveyJS -->
    <script src="survey_core_1.12.1_min.js"></script>
    <script src="survey_js_ui_min.js"></script>
    <link href="survey_core_defaultv2_min.css" rel="stylesheet" />

    <!-- Load JATOS -->
    <script src="jatos.js"></script>
    <style>
      .jspsych-survey-container {
        max-width: 80vw;
        width: 80vw;
        margin: 0 auto;
      }
      .sd-body.sd-body--static {
        max-width: 100% !important;
      }
      .sd-page__title {
        border-bottom: 2px solid #000;
        padding-bottom: 0.75rem;
        margin-bottom: 1.25rem;
        width: 100%;
      }
      .sd-body.sd-completedpage::before,
      .sd-body.sd-completedpage::after {
        height: 0 !important;
        min-height: 0 !important;
        max-height: 0 !important;
        display: block;
      }
      .concrete-word-list {
        display: flex;
        flex-direction: column;
      }
      .concrete-word-row {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid #eee;
      }
      .concrete-word-label {
        font-size: 1.05rem;
        font-weight: 600;
      }
      .concrete-options {
        display: flex;
        gap: 0.4rem;
        align-items: flex-start;
        flex-wrap: nowrap;
        overflow-x: auto;
      }
      .concrete-option {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.1rem;
        font-size: 0.85rem;
        cursor: pointer;
        min-width: 26px;
      }
      .concrete-option input {
        margin: 0;
        cursor: pointer;
      }
      .concrete-sep {
        width: 1px;
        height: 32px;
        background: #ccc;
        margin: 0 0.2rem;
        align-self: center;
      }
      .concrete-word-error {
        color: #c62828;
        font-size: 0.85rem;
        min-height: 1rem;
      }
    </style>
  </head>

  <body>
    <div id="jspsych-target"></div>
  </body>

  <script>
    // -------------------------------------------------------
    // FULL WORD LIST — edit here on page 1 only.
    // Words are shuffled once per participant and stored in the
    // JATOS study session so pages 2–10 all read the same
    // randomized order.  10 pages × 20 words = 200 words.
    // -------------------------------------------------------
    const FULL_WORD_LIST = [
      "dog",
      "bicycle",
      "apple",
      "school",
      "mountain",
      "telephone",
      "democracy",
      "hospital",
      "garden",
      "computer",
      "river",
      "window",
      // Add all your words here...
    ];

    // ---- PAGE CONFIGURATION ----
    const PAGE_INDEX = 0;
    const TOTAL_TASK_PAGES = 10;
    const WORDS_PER_PAGE = 2;
    // ----------------------------

    var jsPsych = initJsPsych({
      on_finish: () => jatos.startNextComponent(jsPsych.data.get().json()),
    });

    const instructions_trial = {
      type: jsPsychSurvey,
      survey_json: {
        completedHtml: "",
        showHeaderOnCompletePage: false,
        completeText: "Begin",
        showQuestionNumbers: "off",
        pages: [
          {
            name: "instructions",
            title: "How to do this task",
            elements: [
              {
                type: "html",
                name: "concrete_instructions",
                html: `
                  <p>Some words refer to things or actions in reality, which you can experience directly through one of the five senses. We call these words concrete words. Other words refer to meanings that cannot be experienced directly but which we know because the meanings can be defined by other words. These are abstract words. Still other words fall in-between the two extremes, because we can experience them to some extent; and in addition, we rely on language to understand them. We want you to indicate how concrete the meaning of each word is for you by using a 9-point rating scale going from abstract to concrete. A concrete word comes with a higher rating and refers to something that exists in reality; you can have immediate experience of it through your senses (smelling, tasting, touching, hearing, seeing) and the actions you do.</p>
                  <p>The easiest way to explain a word is by pointing to it or by demonstrating it (e.g., To explain 'sweet' you could have someone eat sugar; To explain 'jump' you could simply jump up and down or show people a movie clip about someone jumping up and down; To explain 'couch', you could point to a couch or show a picture of a couch). An abstract word comes with a lower rating and refers to something you cannot experience directly through your senses or actions. Its meaning depends on language. The easiest way to explain it is by using other words (e.g., There is no simple way to demonstrate 'justice'; but we can explain the meaning of the word by using other words that capture parts of its meaning).</p>
                  <p>Always think of how concrete (experience based) the meaning of the word is to you. In all likelihood, you will encounter several words you do not know well enough to give a useful rating. This is informative to us too, as in our research we only want to use words known to people. We may also include one or two fake words which cannot be known by you. Please indicate when you don't know a word by using the letter X.</p>
                `,
              },
            ],
          },
        ],
      },
    };

    const slugUsage = {};

    function slugifyWord(word) {
      const normalized = String(word || "")
        .toLowerCase()
        .normalize("NFKD");
      const slug = normalized
        .replace(/[^\p{L}\p{N}]+/gu, "_")
        .replace(/^_+|_+$/g, "");
      if (slug) return slug;
      const fallback = normalized
        .replace(/\s+/g, "_")
        .replace(/[^\p{L}\p{N}_]+/gu, "")
        .replace(/^_+|_+$/g, "");
      return fallback || "word";
    }

    function makeWordFieldNames(word) {
      const slug = slugifyWord(word);
      const occurrence = slugUsage[slug] || 0;
      slugUsage[slug] = occurrence + 1;
      const uniqueSlug = occurrence === 0 ? slug : `${slug}_${occurrence + 1}`;
      return {
        ratingName: `${uniqueSlug}_rating`,
        unknownName: `${uniqueSlug}_unknown`,
      };
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function makeConcreteInlineHtml(wordFields) {
      return `
        <p style="margin: 0 0 0.75rem;">
          Rating (1 = very abstract, 9 = very concrete) or X (Unknown)
        </p>
        <div class="concrete-word-list">
          ${wordFields
            .map(function (field) {
              return `
                <div class="concrete-word-row" data-field-base="${field.ratingName}">
                  <span class="concrete-word-label">${escapeHtml(field.word)}:</span>
                  <div class="concrete-options">
                    ${[1, 2, 3, 4, 5, 6, 7, 8, 9]
                      .map(
                        (n) => `
                      <label class="concrete-option">
                        <span>${n}</span>
                        <input type="radio" name="${field.ratingName}_choice" value="${n}" />
                      </label>
                    `,
                      )
                      .join("")}
                    <div class="concrete-sep"></div>
                    <label class="concrete-option">
                      <span>X</span>
                      <input type="radio" name="${field.ratingName}_choice" value="X" />
                    </label>
                  </div>
                  <div class="concrete-word-error" aria-live="polite"></div>
                </div>
              `;
            })
            .join("")}
        </div>
      `;
    }

    function makeConcreteMatrixSurvey(words) {
      const wordFields = words.map(function (word) {
        return { word, ...makeWordFieldNames(word) };
      });
      const htmlQuestionName = `concrete_block_${PAGE_INDEX}_rows`;
      let renderedQuestionElement = null;

      return {
        type: jsPsychSurvey,
        survey_json: {
          showCompletedPage: false,
          showHeaderOnCompletePage: false,
          completedHtml: "",
          completeText: "Next",
          showQuestionNumbers: "off",
          pages: [
            {
              name: `concrete_block_${PAGE_INDEX}`,
              title: `Concreteness ratings (Block ${PAGE_INDEX + 1} of ${TOTAL_TASK_PAGES})`,
              elements: [
                {
                  type: "html",
                  name: htmlQuestionName,
                  html: makeConcreteInlineHtml(wordFields),
                },
              ],
            },
          ],
        },
        survey_function: function (survey) {
          survey.onAfterRenderQuestion.add(function (_, options) {
            if (options.question.name !== htmlQuestionName) return;
            renderedQuestionElement = options.htmlElement;
          });

          survey.onCompleting.add(function (sender, options) {
            if (!renderedQuestionElement) return;
            let hasErrors = false;
            wordFields.forEach(function (field) {
              const row = renderedQuestionElement.querySelector(
                `[data-field-base="${field.ratingName}"]`,
              );
              const errorEl = row.querySelector(".concrete-word-error");
              const checked = row.querySelector('input[type="radio"]:checked');
              errorEl.textContent = "";

              if (!checked) {
                hasErrors = true;
                errorEl.textContent = "Please select a rating or X.";
                sender.setValue(field.ratingName, null);
                sender.setValue(field.unknownName, null);
                return;
              }

              if (checked.value === "X") {
                sender.setValue(field.ratingName, null);
                sender.setValue(field.unknownName, "X");
              } else {
                sender.setValue(field.ratingName, Number(checked.value));
                sender.setValue(field.unknownName, null);
              }
            });
            if (hasErrors) options.allowComplete = false;
          });
        },
      };
    }

    jatos.onLoad(() => {
      const labID =
        jatos.studySessionData.labID || jatos.urlQueryParameters.labID || null;
      const participant_uuid = jatos.studySessionData.participantUUID || "N/A";
      jsPsych.data.addProperties({
        labID,
        participant_uuid,
        concrete_page: PAGE_INDEX + 1,
      });

      const shuffledWords = jsPsych.randomization.shuffle([...FULL_WORD_LIST]);
      jatos.studySessionData.shuffledWords = shuffledWords;
      jatos.studySessionData.labID = labID;
      jatos.studySessionData.wordsPerPage = WORDS_PER_PAGE;

      const pageWords = shuffledWords.slice(0, WORDS_PER_PAGE);
      jsPsych.run([instructions_trial, makeConcreteMatrixSurvey(pageWords)]);
    });
  </script>
</html>
