<!doctype html>
<html>
  <head>
    <title>Age of Acquisition Study</title>
    <script src="unpkg_jspsych.js"></script>
    <script src="unpkg_jspych_plugin_html_button_response.js"></script>
    <script src="jspsych_plugin_survey_dist_index_browser.js"></script>
    <link href="jspsych_css_jspsych.css" rel="stylesheet" />
    <script src="survey_core_1.12.1_min.js"></script>
    <script src="survey_js_ui_min.js"></script>
    <link href="survey_core_defaultv2_min.css" rel="stylesheet" />
    <script src="jatos.js"></script>
    <style>
      .jspsych-survey-container {
        max-width: 80vw;
        width: 80vw;
        margin: 0 auto;
      }
      .sd-body.sd-body--static {
        max-width: 100% !important;
      }
      .sd-page__title {
        border-bottom: 2px solid #000;
        padding-bottom: 0.75rem;
        margin-bottom: 1.25rem;
        width: 100%;
      }
      .sd-body.sd-completedpage::before,
      .sd-body.sd-completedpage::after {
        height: 0 !important;
        min-height: 0 !important;
        max-height: 0 !important;
        display: block;
      }
      .aoa-word-list {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .aoa-word-row {
        display: grid;
        grid-template-columns: minmax(140px, 220px) 180px auto;
        align-items: center;
        column-gap: 0.9rem;
        row-gap: 0.2rem;
        padding: 0.35rem 0;
      }
      .aoa-word-label {
        font-size: 1.05rem;
        font-weight: 600;
      }
      .aoa-word-age {
        width: 100%;
        max-width: 180px;
        padding: 0.45rem 0.6rem;
        border: 1px solid #bdbdbd;
        border-radius: 6px;
        font: inherit;
        box-sizing: border-box;
      }
      .aoa-word-age.aoa-word-age--invalid {
        border-color: #c62828;
      }
      .aoa-word-unknown {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        white-space: nowrap;
        font-size: 1rem;
      }
      .aoa-word-unknown input {
        margin: 0;
      }
      .aoa-word-error {
        grid-column: 2 / 4;
        color: #c62828;
        font-size: 0.85rem;
        min-height: 1rem;
      }
      @media (max-width: 700px) {
        .aoa-word-row {
          grid-template-columns: minmax(110px, 1fr) 120px auto;
          column-gap: 0.65rem;
        }
        .aoa-word-label {
          font-size: 0.98rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="jspsych-target"></div>
  </body>
  <script>
    // ---- PAGE CONFIGURATION ----
    // page2 = PAGE_INDEX 1, page3 = 2, ..., page10 = 9
    const PAGE_INDEX = 8;
    const TOTAL_TASK_PAGES = 10;
    // ----------------------------

    var jsPsych = initJsPsych({
      on_finish: () => jatos.startNextComponent(jsPsych.data.get().json()),
    });

    const UNKNOWN_WORD_CHOICE = "X";
    const slugUsage = {};

    function slugifyWord(word) {
      const normalized = String(word || "")
        .toLowerCase()
        .normalize("NFKD");
      const slug = normalized
        .replace(/[^\p{L}\p{N}]+/gu, "_")
        .replace(/^_+|_+$/g, "");
      if (slug) return slug;
      const fallback = normalized
        .replace(/\s+/g, "_")
        .replace(/[^\p{L}\p{N}_]+/gu, "")
        .replace(/^_+|_+$/g, "");
      return fallback || "word";
    }

    function makeWordFieldNames(word) {
      const slug = slugifyWord(word);
      const occurrence = slugUsage[slug] || 0;
      slugUsage[slug] = occurrence + 1;
      const uniqueSlug = occurrence === 0 ? slug : `${slug}_${occurrence + 1}`;
      return {
        ageName: `${uniqueSlug}_age`,
        unknownName: `${uniqueSlug}_unknown`,
      };
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function clearRowError(row, ageInput) {
      row.querySelector(".aoa-word-error").textContent = "";
      ageInput.classList.remove("aoa-word-age--invalid");
    }

    function setRowError(row, ageInput, message) {
      row.querySelector(".aoa-word-error").textContent = message;
      ageInput.classList.add("aoa-word-age--invalid");
    }

    function makeAoaInlineHtml(wordFields) {
      return `
        <div class="aoa-word-list">
          ${wordFields
            .map(function (field) {
              return `
                <div class="aoa-word-row" data-field-base="${field.ageName}">
                  <label class="aoa-word-label" for="${field.ageName}_input">${escapeHtml(field.word)}:</label>
                  <input
                    class="aoa-word-age"
                    id="${field.ageName}_input"
                    type="number"
                    min="1"
                    max="100"
                    inputmode="numeric"
                    placeholder="Age"
                    data-age-name="${field.ageName}"
                  />
                  <label class="aoa-word-unknown">
                    <input
                      type="radio"
                      name="${field.unknownName}_choice"
                      value="${UNKNOWN_WORD_CHOICE}"
                      data-unknown-name="${field.unknownName}"
                    />
                    <span>${UNKNOWN_WORD_CHOICE}</span>
                  </label>
                  <div class="aoa-word-error" aria-live="polite"></div>
                </div>
              `;
            })
            .join("")}
        </div>
      `;
    }

    function makeAoaMatrixSurvey(words) {
      const wordFields = words.map(function (word) {
        return { word, ...makeWordFieldNames(word) };
      });
      const htmlQuestionName = `aoa_block_${PAGE_INDEX}_rows`;
      let renderedQuestionElement = null;

      const surveyJson = {
        showCompletedPage: false,
        showHeaderOnCompletePage: false,
        completedHtml: "",
        completeText: "Next",
        showQuestionNumbers: "off",
        pages: [
          {
            name: `aoa_block_${PAGE_INDEX}`,
            title: `Age ratings (Block ${PAGE_INDEX + 1} of ${TOTAL_TASK_PAGES})`,
            description:
              "For each word, enter the age (in years) when you think you learned it. An approximate age is good enough for this rating. If you do not know the word, please select the letter X for unknown.",
            elements: [
              {
                type: "html",
                name: htmlQuestionName,
                html: makeAoaInlineHtml(wordFields),
              },
            ],
          },
        ],
      };

      return {
        type: jsPsychSurvey,
        survey_json: surveyJson,
        survey_function: function (survey) {
          survey.onAfterRenderQuestion.add(function (_, options) {
            if (options.question.name !== htmlQuestionName) return;
            renderedQuestionElement = options.htmlElement;
            const rows =
              renderedQuestionElement.querySelectorAll(".aoa-word-row");
            rows.forEach(function (row) {
              const ageInput = row.querySelector(".aoa-word-age");
              const unknownInput = row.querySelector('input[type="radio"]');
              ageInput.addEventListener("input", function () {
                if (ageInput.value !== "") unknownInput.checked = false;
                clearRowError(row, ageInput);
              });
              unknownInput.addEventListener("change", function () {
                if (unknownInput.checked) ageInput.value = "";
                clearRowError(row, ageInput);
              });
            });
          });

          survey.onCompleting.add(function (sender, options) {
            if (!renderedQuestionElement) return;
            let hasErrors = false;
            wordFields.forEach(function (field) {
              const row = renderedQuestionElement.querySelector(
                `[data-field-base="${field.ageName}"]`,
              );
              const ageInput = row.querySelector(".aoa-word-age");
              const unknownInput = row.querySelector('input[type="radio"]');
              const ageValue = ageInput.value.trim();
              clearRowError(row, ageInput);

              if (unknownInput.checked) {
                sender.setValue(field.ageName, null);
                sender.setValue(field.unknownName, UNKNOWN_WORD_CHOICE);
                return;
              }
              if (!ageValue) {
                hasErrors = true;
                sender.setValue(field.ageName, null);
                sender.setValue(field.unknownName, null);
                setRowError(row, ageInput, "Enter an age or if you do not know the word, please select the letter X for unknown.");
                return;
              }
              const numericAge = Number(ageValue);
              if (
                !Number.isInteger(numericAge) ||
                numericAge < 1 ||
                numericAge > 100
              ) {
                hasErrors = true;
                sender.setValue(field.ageName, null);
                sender.setValue(field.unknownName, null);
                setRowError(
                  row,
                  ageInput,
                  "Enter a whole number from 1 to 100.",
                );
                return;
              }
              sender.setValue(field.ageName, numericAge);
              sender.setValue(field.unknownName, null);
            });
            if (hasErrors) options.allowComplete = false;
          });
        },
      };
    }

    jatos.onLoad(() => {
      const labID =
        jatos.studySessionData.labID || jatos.urlQueryParameters.labID || null;
      const participant_uuid = jatos.studySessionData.participantUUID || "N/A";
      jsPsych.data.addProperties({
        labID,
        participant_uuid,
        aoa_page: PAGE_INDEX + 1,
      });

      // Retrieve the shuffled word list stored by page 1.
      // Each task page shows WORDS_PER_PAGE words from its slice.
      const WORDS_PER_PAGE = jatos.studySessionData.wordsPerPage || 20;
      const allWords = jatos.studySessionData.shuffledWords || [];
      const startIdx = PAGE_INDEX * WORDS_PER_PAGE;
      const pageWords = allWords.slice(startIdx, startIdx + WORDS_PER_PAGE);

      jsPsych.run([makeAoaMatrixSurvey(pageWords)]);
    });
  </script>
</html>
