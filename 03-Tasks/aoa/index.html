<!doctype html>
<html>
  <head>
    <title>Age of Acquisition Study</title>

    <!-- Load jsPsych -->
    <script src="unpkg_jspsych.js"></script>
    <script src="unpkg_jspych_plugin_html_button_response.js"></script>
    <script src="jspsych_plugin_survey_dist_index_browser.js"></script>
    <link
      href="jspsych_css_jspsych.css"
      rel="stylesheet"
    />

    <!-- Load SurveyJS -->
    <script src="survey_core_1.12.1_min.js"></script>
    <script src="survey_js_ui_min.js"></script>
    <link
      href="survey_core_defaultv2_min.css"
      rel="stylesheet"
    />

    <!-- Load JATOS -->
    <script src="jatos.js"></script>
    <style>
      /* Widen the jsPsych + SurveyJS container */
      .jspsych-survey-container {
        max-width: 80vw; /* 80% of viewport width */
        width: 80vw;
        margin: 0 auto; /* center horizontally */
      }
      /* Override SurveyJS internal max-width that was squishing content */
      .sd-body.sd-body--static {
        max-width: 100% !important; /* allow it to fill the wider container */
      }
      /* Black full-width divider under each SurveyJS page title */
      .sd-page__title {
        border-bottom: 2px solid #000; /* solid black line */
        padding-bottom: 0.75rem;
        margin-bottom: 1.25rem;
        width: 100%;
      }
      
      /* Remove extra spacing created by SurveyJS completed-page pseudo-elements */
      .sd-body.sd-completedpage::before,
      .sd-body.sd-completedpage::after {
        height: 0 !important;
        min-height: 0 !important;
        max-height: 0 !important;
        display: block;
      }

      .aoa-word-list {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .aoa-word-row {
        display: grid;
        grid-template-columns: minmax(140px, 220px) 180px auto;
        align-items: center;
        column-gap: 0.9rem;
        row-gap: 0.2rem;
        padding: 0.35rem 0;
      }

      .aoa-word-label {
        font-size: 1.05rem;
        font-weight: 600;
      }

      .aoa-word-age {
        width: 100%;
        max-width: 180px;
        padding: 0.45rem 0.6rem;
        border: 1px solid #bdbdbd;
        border-radius: 6px;
        font: inherit;
        box-sizing: border-box;
      }

      .aoa-word-age.aoa-word-age--invalid {
        border-color: #c62828;
      }

      .aoa-word-unknown {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        white-space: nowrap;
        font-size: 1rem;
      }

      .aoa-word-unknown input {
        margin: 0;
      }

      .aoa-word-error {
        grid-column: 2 / 4;
        color: #c62828;
        font-size: 0.85rem;
        min-height: 1rem;
      }

      @media (max-width: 700px) {
        .aoa-word-row {
          grid-template-columns: minmax(110px, 1fr) 120px auto;
          column-gap: 0.65rem;
        }

        .aoa-word-label {
          font-size: 0.98rem;
        }
      }
    </style>
  </head>

  <body>
    <div id="jspsych-target"></div>
  </body>

  <script>
    // 1) Initialize jsPsych
    var jsPsych = initJsPsych({
      //on_trial_start: jatos.addAbortButton,
      on_finish: () => jatos.startNextComponent(jsPsych.data.get().json()),
    });

    // 2b) Screen shown if participant does NOT consent
    const no_consent = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<h2>Thank you</h2><p>You have chosen not to participate. You may close this window.</p>`,
      choices: ["Close"],
    };

    // Generate a participant UUID once per session
    const participant_uuid =
      window.crypto && window.crypto.randomUUID
        ? window.crypto.randomUUID()
        : Math.random().toString(36).substring(2, 10) + "-" + Date.now();

    // Combined multi-page SurveyJS survey (consent + demographics + instructions)
    const combinedSurveyJson = {
      completedHtml: "",
      showHeaderOnCompletePage: false,
      pageNextText: "Next",
      pagePrevText: "Back",
      completeText: "Next",
      pages: [
        // ----- PAGE 1: CONSENT -----
        {
          name: "consent",
          title: "Consent to Participate",
          elements: [
            {
              type: "html",
              name: "consent_text",
              html: `
                <p>Please read the following carefully before continuing:</p>
                <p>This study involves completing brief questions and/or tasks about language and cognition. Your participation is voluntary. You may stop at any time without penalty. Your responses will be recorded for research purposes but will be kept confidential and analyzed in anonymized form.</p>
                <p>By proceeding you indicate that you are at least 18 years old.</p>
              `,
            },
            {
              type: "radiogroup",
              name: "consent_choice",
              title: "Do you consent to participate?",
              isRequired: true,
              choices: ["I Consent", "I Do Not Consent"],
            },
          ],
        },

        // ----- PAGE 2: DEMOGRAPHICS (only visible if they consent) -----
        {
          name: "demographics",
          title: "Demographic Information",
          visibleIf: "{consent_choice} = 'I Consent'",
          elements: [
            {
              type: "radiogroup",
              name: "gender",
              title: "Please tell us your gender:",
              choices: ["Male", "Female", "Other", "Prefer not to say"],
            },
            {
              type: "text",
              name: "birth_year",
              title: "Which year were you born? Please enter a four-digit year",
              isRequired: true,
              inputType: "number",
              validators: [{ type: "numeric", minValue: 1900, maxValue: 2025 }],
            },
            {
              type: "radiogroup",
              name: "education",
              title: "Please tell us your highest education level:",
              choices: [
                "Less than high school diploma",
                "High school diploma",
                "Associate's degree or two-year degree",
                "Bachelor's degree or four-year degree",
                "Master's degree or equivalent",
                "Doctoral degree or equivalent",
              ],
            },
            {
              type: "text",
              name: "native_language",
              title: "What is your native (first) language?",
            },
            {
              type: "radiogroup",
              name: "handedness",
              title: "Are you primarily left- or right-handed?",
              isRequired: true,
              choices: ["Left-handed", "Right-handed"],
            },
          ],
        },

        // ----- PAGE 3: TASK INSTRUCTIONS (only visible if they consent) -----
        {
          name: "instructions",
          title: "How to do this task",
          visibleIf: "{consent_choice} = 'I Consent'",
          elements: [
            {
              type: "html",
              name: "aoa_instructions",
              html: `
                <p>Please rate the following words by entering the age in years at which you think you learned the word.</p>
                <p>We mean the age at which you would have understood the word if somebody had used it in front of you, <strong>EVEN IF YOU DID NOT</strong> use, read, or write it at the time.</p>
                <p>If you do <strong>not know</strong> the word, please enter the letter <strong>X</strong>.</p>
              `,
            },
          ],
        },
      ],
    };

    const pretask_survey = {
      type: jsPsychSurvey,
      survey_json: combinedSurveyJson,
    };

    // -----------------------------
    // DEMO AOA TASK (SHORT LIST)
    // Replace `sampleWords` with your 400 words later
    // -----------------------------
    const sampleWords = [
      "dog",
      "bicycle",
      "apple",
      "school",
      "mountain",
      "telephone",
      "democracy",
      "hospital",
      "garden",
      "computer",
      "river",
      "window",
    ];

    // 1) Shuffle words once per participant
    const shuffledWords = jsPsych.randomization.shuffle(sampleWords);
    const UNKNOWN_WORD_CHOICE = "X";

    // 2) Split into small blocks (6 words per page for the demo)
    const BLOCK_SIZE = 6;
    const wordBlocks = [];
    for (let i = 0; i < shuffledWords.length; i += BLOCK_SIZE) {
      wordBlocks.push(shuffledWords.slice(i, i + BLOCK_SIZE));
    }

    function slugifyWord(word) {
      const slug = word.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
      return slug || "word";
    }

    function makeWordFieldNames(blockIndex, word, wordIndex) {
      const baseName = `aoa_block_${blockIndex}_${slugifyWord(word)}_${wordIndex}`;
      return {
        ageName: `${baseName}_age`,
        unknownName: `${baseName}_unknown`,
      };
    }

    function hasValue(value) {
      return value !== null && value !== undefined && value !== "";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function clearRowError(row, ageInput) {
      row.querySelector(".aoa-word-error").textContent = "";
      ageInput.classList.remove("aoa-word-age--invalid");
    }

    function setRowError(row, ageInput, message) {
      row.querySelector(".aoa-word-error").textContent = message;
      ageInput.classList.add("aoa-word-age--invalid");
    }

    function makeAoaInlineHtml(wordFields) {
      return `
        <div class="aoa-word-list">
          ${wordFields
            .map(function (field) {
              return `
                <div class="aoa-word-row" data-field-base="${field.ageName}">
                  <label class="aoa-word-label" for="${field.ageName}_input">${escapeHtml(field.word)}:</label>
                  <input
                    class="aoa-word-age"
                    id="${field.ageName}_input"
                    type="number"
                    min="1"
                    max="100"
                    inputmode="numeric"
                    placeholder="Age"
                    data-age-name="${field.ageName}"
                  />
                  <label class="aoa-word-unknown">
                    <input
                      type="radio"
                      name="${field.unknownName}_choice"
                      value="${UNKNOWN_WORD_CHOICE}"
                      data-unknown-name="${field.unknownName}"
                    />
                    <span>${UNKNOWN_WORD_CHOICE}</span>
                  </label>
                  <div class="aoa-word-error" aria-live="polite"></div>
                </div>
              `;
            })
            .join("")}
        </div>
      `;
    }

    // 3) Helper: build one SurveyJS page for a block of words
    function makeAoaMatrixSurvey(words, blockIndex) {
      const wordFields = words.map(function (word, wordIndex) {
        return {
          word: word,
          ...makeWordFieldNames(blockIndex, word, wordIndex),
        };
      });
      const htmlQuestionName = `aoa_block_${blockIndex}_rows`;
      let renderedQuestionElement = null;

      const surveyJson = {
        showCompletedPage: false,
        showHeaderOnCompletePage: false,
        completedHtml: "",
        completeText: "Next",
        showQuestionNumbers: "off",
        pages: [
          {
            name: `aoa_block_${blockIndex}`,
            title: `Word ratings (Block ${blockIndex + 1} of ${wordBlocks.length})`,
            description:
              "For each word, enter the age (in years) when you think you learned it, or select X if unknown.",
            elements: [
              {
                type: "html",
                name: htmlQuestionName,
                html: makeAoaInlineHtml(wordFields),
              },
            ],
          },
        ],
      };

      return {
        type: jsPsychSurvey,
        survey_json: surveyJson,
        survey_function: function (survey) {
          survey.onAfterRenderQuestion.add(function (_, options) {
            if (options.question.name !== htmlQuestionName) {
              return;
            }

            renderedQuestionElement = options.htmlElement;
            const rows = renderedQuestionElement.querySelectorAll(".aoa-word-row");
            rows.forEach(function (row) {
              const ageInput = row.querySelector(".aoa-word-age");
              const unknownInput = row.querySelector('input[type="radio"]');

              ageInput.addEventListener("input", function () {
                if (ageInput.value !== "") {
                  unknownInput.checked = false;
                }
                clearRowError(row, ageInput);
              });

              unknownInput.addEventListener("change", function () {
                if (unknownInput.checked) {
                  ageInput.value = "";
                }
                clearRowError(row, ageInput);
              });
            });
          });

          survey.onCompleting.add(function (sender, options) {
            if (!renderedQuestionElement) {
              return;
            }

            let hasErrors = false;
            wordFields.forEach(function (field) {
              const row = renderedQuestionElement.querySelector(`[data-field-base="${field.ageName}"]`);
              const ageInput = row.querySelector(".aoa-word-age");
              const unknownInput = row.querySelector('input[type="radio"]');
              const ageValue = ageInput.value.trim();

              clearRowError(row, ageInput);

              if (unknownInput.checked) {
                sender.setValue(field.ageName, null);
                sender.setValue(field.unknownName, UNKNOWN_WORD_CHOICE);
                return;
              }

              if (!ageValue) {
                hasErrors = true;
                sender.setValue(field.ageName, null);
                sender.setValue(field.unknownName, null);
                setRowError(row, ageInput, "Enter an age or select X.");
                return;
              }

              const numericAge = Number(ageValue);
              if (!Number.isInteger(numericAge) || numericAge < 1 || numericAge > 100) {
                hasErrors = true;
                sender.setValue(field.ageName, null);
                sender.setValue(field.unknownName, null);
                setRowError(row, ageInput, "Enter a whole number from 1 to 100.");
                return;
              }

              sender.setValue(field.ageName, numericAge);
              sender.setValue(field.unknownName, null);
            });

            if (hasErrors) {
              options.allowComplete = false;
            }
          });
        },
      };
    }

    // 4) Create one jsPsych trial per block
    const aoa_trials = wordBlocks.map((block, i) =>
      makeAoaMatrixSurvey(block, i),
    );

    // Final thank-you screen shown AFTER all word-rating blocks (SurveyJS style)
    const final_thankyou = {
      type: jsPsychSurvey,
      survey_json: {
        showCompletedPage: false,
        showHeaderOnCompletePage: false,
        completedHtml: "",
        completeText: "Finish",
        pages: [
          {
            name: "thank_you",
            title: "Thank you for participating",
            elements: [
              {
                type: "html",
                name: "thank_you_text",
                html: `
                  <p>You have completed the word ratings.</p>
                  <p>Your participant number is:</p>
                  <p><strong>${participant_uuid}</strong></p>
                  <p>Please keep or copy this number if you are asked for it.</p>
                `,
              },
            ],
          },
        ],
      },
    };

    const task_timeline = {
      timeline: [...aoa_trials, final_thankyou],
      conditional_function: function () {
        const last = jsPsych.data.get().last(1).values()[0];
        return last.response && last.response.consent_choice === "I Consent";
      },
    };

    const timeline = [
      pretask_survey,
      {
        timeline: [no_consent],
        conditional_function: function () {
          const last = jsPsych.data.get().last(1).values()[0];
          return last.response && last.response.consent_choice === "I Do Not Consent";
        },
      },
      task_timeline,
    ];

    // 4) Run the study
    jatos.onLoad(() => {
      jsPsych.run(timeline);
    });
  </script>
</html>
