<!doctype html>
<html>

<head>
  <title>Arousal Study</title>

  <!-- Load jsPsych -->
  <script src="https://unpkg.com/jspsych@7.3.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-survey/dist/index.browser.js"></script>
  <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" />

  <!-- Load SurveyJS -->
  <script src="https://unpkg.com/survey-core@1.12.2/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-js-ui@1.12.2/survey-js-ui.min.js"></script>
  <link href="https://unpkg.com/survey-core@1.12.2/defaultV2.min.css" rel="stylesheet" />

  <style>
    /* Widen the jsPsych + SurveyJS container */
    .jspsych-survey-container {
      max-width: 80vw;
      /* 80% of viewport width */
      width: 80vw;
      margin: 0 auto;
      /* center horizontally */
    }

    /* Override SurveyJS internal max-width that was squishing content */
    .sd-body.sd-body--static {
      max-width: 100% !important;
      /* allow it to fill the wider container */
    }

    /* Black full-width divider under each SurveyJS page title */
    .sd-page__title {
      border-bottom: 2px solid #000;
      /* solid black line */
      padding-bottom: 0.75rem;
      margin-bottom: 1.25rem;
      width: 100%;
    }

    /* Remove extra spacing created by SurveyJS completed-page pseudo-elements */
    .sd-body.sd-completedpage::before,
    .sd-body.sd-completedpage::after {
      height: 0 !important;
      min-height: 0 !important;
      max-height: 0 !important;
      display: block;
    }
  </style>
</head>

<body>
  <div id="jspsych-target"></div>
</body>

<script>
  // 1) Initialize jsPsych
  const jsPsych = initJsPsych({
    on_finish: function () {
      jsPsych.data.displayData(); // set to false/remove when deploying
    },
  });

  // 2b) Screen shown if participant does NOT consent
  const no_consent = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<h2>Thank you</h2><p>You have chosen not to participate. You may close this window.</p>`,
    choices: ["Close"],
  };

  // Generate a participant UUID once per session
  const participant_uuid =
    window.crypto && window.crypto.randomUUID
      ? window.crypto.randomUUID()
      : Math.random().toString(36).substring(2, 10) + "-" + Date.now();

  // Combined multi-page SurveyJS survey (consent + demographics + instructions)
  const combinedSurveyJson = {
    completedHtml: "",
    showHeaderOnCompletePage: false,
    pageNextText: "Next",
    pagePrevText: "Back",
    completeText: "Next",
    pages: [
      // ----- PAGE 1: CONSENT -----
      {
        name: "consent",
        title: "Consent to Participate",
        elements: [
          {
            type: "html",
            name: "consent_text",
            html: `
                <p>Please read the following carefully before continuing:</p>
                <p>This study involves completing brief questions and/or tasks about language and cognition. Your participation is voluntary. You may stop at any time without penalty. Your responses will be recorded for research purposes but will be kept confidential and analyzed in anonymized form.</p>
                <p>By proceeding you indicate that you are at least 18 years old.</p>
              `,
          },
          {
            type: "radiogroup",
            name: "consent_choice",
            title: "Do you consent to participate?",
            isRequired: true,
            choices: ["I Consent", "I Do Not Consent"],
          },
        ],
      },

      // ----- PAGE 2: DEMOGRAPHICS (only visible if they consent) -----
      {
        name: "demographics",
        title: "Demographic Information",
        visibleIf: "{consent_choice} = 'I Consent'",
        elements: [
          {
            type: "radiogroup",
            name: "gender",
            title: "Please tell us your gender:",
            choices: ["Male", "Female", "Other", "Prefer not to say"],
          },
          {
            type: "text",
            name: "birth_year",
            title: "Which year were you born? Please enter a four-digit year",
            isRequired: true,
            inputType: "number",
            validators: [{ type: "numeric", minValue: 1900, maxValue: 2025 }],
          },
          {
            type: "radiogroup",
            name: "education",
            title: "Please tell us your highest education level:",
            choices: [
              "Less than high school",
              "High school",
              "Associate's degree or two-year degree",
              "Bachelor's degree or four-year degree",
              "Master's degree or equivalent",
              "Doctoral degree or equivalent",
            ],
          },
          {
            type: "text",
            name: "native_language",
            title: "What is your native (first) language?",
          },
          {
            type: "radiogroup",
            name: "handedness",
            title: "Are you primarily left- or right-handed?",
            isRequired: true,
            choices: ["Left-handed", "Right-handed"],
          },
        ],
      },

      // ----- PAGE 3: TASK INSTRUCTIONS (only visible if they consent) -----
      {
        name: "instructions",
        title: "How to do this task",
        visibleIf: "{consent_choice} = 'I Consent'",
        elements: [
          {
            type: "html",
            name: "arousal_instructions",
            html: `
                <figure style="margin: 0 0 1rem 0;">
                  <img
                    src="arousal_image.png"
                    alt="Self-Assessment Manikin (SAM) scale for arousal"
                    style="max-width: 100%; height: auto; display: block;"
                  />
                  <figcaption style="font-size: 0.9em; margin-top: 0.25rem;">
                    <em>Self-Assessment Manikin (SAM)</em> arousal scale. Procedure adapted from Prete, Laeng, &amp; Tommasi (2022); SAM from Bradley &amp; Lang (1999).
                   </figcaption>
                </figure>

                <p>In this section, you will rate each word for <strong>arousal</strong> using the <strong>Self-Assessment Manikin (SAM)</strong> image.</p>

                <p>Arousal refers to how <strong>excited/activated</strong> or <strong>calm/relaxed</strong> the word makes you feel:
                <br/>1 = very calm / very relaxed
                <br/>9 = very excited / very activated</p>

                <p>For each word, select the response that best matches your <strong>first and immediate reaction</strong> when you read the word. There are no right or wrong answers.</p>

                <p>If you do <strong>not know</strong> what a word means, select <strong>X</strong>.</p>
              `,
          },
        ],
      },
    ],
  };

  const pretask_survey = {
    type: jsPsychSurvey,
    survey_json: combinedSurveyJson,
  };

  // -----------------------------
  // DEMO AROUSAL TASK (SHORT LIST)
  // Replace `sampleWords` with your 400 words later
  // -----------------------------
  const sampleWords = [
    "dog",
    "bicycle",
    "apple",
    "school",
    "mountain",
    "telephone",
    "democracy",
    "hospital",
    "garden",
    "computer",
    "river",
    "window",
  ];

  // 1) Shuffle words once per participant
  const shuffledWords = jsPsych.randomization.shuffle(sampleWords);

  // 2) Split into small blocks (6 words per block for the demo)
  const BLOCK_SIZE = 6;
  const wordBlocks = [];
  for (let i = 0; i < shuffledWords.length; i += BLOCK_SIZE) {
    wordBlocks.push(shuffledWords.slice(i, i + BLOCK_SIZE));
  }

  // 3) Helper: build ONE SurveyJS page per block (AROUSAL only) using clickable choices
  function makeArousalMatrixSurvey(words, blockIndex) {
    const samHtml = `
        <figure style="margin: 0 0 1rem 0;">
          <img
            src="arousal_image.png"
            alt="Self-Assessment Manikin (SAM) scale for arousal"
            style="max-width: 100%; height: auto; display: block;"
          />
          <figcaption style="font-size: 0.9em; margin-top: 0.25rem;">
            <em>Self-Assessment Manikin (SAM)</em> arousal scale. Procedure adapted from Prete, Laeng, &amp; Tommasi (2022); SAM from Bradley &amp; Lang (1999).
          </figcaption>
        </figure>
      `;

    const samChoices = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "X"];
    const rows = words.map((w) => ({ value: w, text: w }));
    const columns = samChoices.map((c) => ({ value: c, text: c }));

    const surveyJson = {
      showCompletedPage: false,
      showHeaderOnCompletePage: false,
      completedHtml: "",
      completeText: "Next",
      pages: [
        {
          name: `arousal_page_${blockIndex}`,
          title: `Arousal ratings (Block ${blockIndex + 1} of ${wordBlocks.length})`,
          elements: [
            { type: "html", name: `sam_arousal_${blockIndex}`, html: samHtml },
            {
              type: "matrix",
              name: `arousal_block_${blockIndex}`,
              title:
                "For each word, rate AROUSAL (1 = very calm/relaxed, 9 = very excited/activated). If you do not know the word, choose X.",
              isAllRowRequired: true,
              rows: rows,
              columns: columns,
            },
          ],
        },
      ],
    };

    return {
      type: jsPsychSurvey,
      survey_json: surveyJson,
    };
  }

  // 4) Create one jsPsych trial per block
  const arousal_trials = wordBlocks.map((block, i) =>
    makeArousalMatrixSurvey(block, i)
  );

  // Final thank-you screen shown AFTER all word-rating blocks (SurveyJS style)
  const final_thankyou = {
    type: jsPsychSurvey,
    survey_json: {
      showCompletedPage: false,
      showHeaderOnCompletePage: false,
      completedHtml: "",
      completeText: "Finish",
      pages: [
        {
          name: "thank_you",
          title: "Thank you for participating",
          elements: [
            {
              type: "html",
              name: "thank_you_text",
              html: `
                  <p>You have completed the word ratings.</p>
                  <p>Your participant number is:</p>
                  <p><strong>${participant_uuid}</strong></p>
                  <p>Please keep or copy this number if you are asked for it.</p>
                `,
            },
          ],
        },
      ],
    },
  };

  // 5) Timeline with consent gating
  const task_timeline = {
    timeline: [...arousal_trials, final_thankyou],
    conditional_function: function () {
      const last = jsPsych.data.get().last(1).values()[0];
      return last.response && last.response.consent_choice === "I Consent";
    },
  };

  const timeline = [
    pretask_survey,
    {
      timeline: [no_consent],
      conditional_function: function () {
        const last = jsPsych.data.get().last(1).values()[0];
        return last.response && last.response.consent_choice === "I Do Not Consent";
      },
    },
    task_timeline,
  ];

  // 6) Run the study
  jsPsych.run(timeline);
</script>

</html>
